name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blogforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "1"
      FORCE_COLOR: "0"
      E2E_PORT: "5199"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Production dependency audit (root)
        # AGENTS.md §3: high/critical must be zero for shipped code.
        run: npm audit --omit=dev --audit-level=high

      - name: Lint root code
        run: npm run lint

      - name: Test root (frontend) with coverage
        run: npm run test:coverage

      - name: Build root frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Bundle budget gate
        run: npm run size

      - name: Install main backend dependencies
        run: npm ci --prefix backend

      - name: Production dependency audit (backend)
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend

      - name: Lint main backend
        # backend/eslint.config.js exists because the root config ignores the
        # backend tree; without this step backend was never actually linted.
        run: npm run lint
        working-directory: backend

      - name: Test main backend (coverage ratchet enforced by jest.config.js)
        run: npm run test:ci --prefix backend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run main-repo Playwright E2E against the production build
        run: npx playwright test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI agent dependencies
        run: pip install -r ai-agent/requirements.txt

      - name: Test AI agent
        # unittest collects only TestCase subclasses, so 59 of 113 test files
        # (1336 tests, every engine added since 2026-10-28) never ran here.
        # pytest is already pinned in ai-agent/requirements.txt.
        run: python -m pytest tests -q --ignore=tests/test_cli_e2e_progress.py
        working-directory: ai-agent

      - name: Python static analysis (ratchet)
        # ruff and bandit both carry a measured backlog; the baseline in
        # ai-agent/lint-baseline.json may only fall. A tool that is not
        # installed reports "not measured" and fails the step rather than
        # passing silently.
        run: python scripts/lint_ratchet.py

      - name: Install generated project dependencies (backend)
        run: npm ci --prefix generated-projects/blogforge/backend

      - name: Install generated project dependencies (frontend)
        run: npm ci --prefix generated-projects/blogforge/frontend

      - name: Run generated backend migrations
        # The fixture talks to the postgres service container, not localhost:
        # a migration step with no database proves nothing.
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/blogforge
          DB_DIALECT: postgres
        run: npm run db:migrate --prefix generated-projects/blogforge/backend

      - name: Test generated backend
        # The root package.json forwards test:backend to backend/; calling the
        # backend package directly asked for a script it does not define.
        # The suite skips every test unless TEST_DATABASE_URL is set -- setting
        # only DATABASE_URL leaves the leg green with zero assertions run.
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/blogforge
        run: npm run test:backend --prefix generated-projects/blogforge

      - name: Build generated frontend
        run: npm run build --prefix generated-projects/blogforge/frontend

      - name: Run Playwright E2E for generated project
        # The Playwright config lives in frontend/, not at the fixture root.
        run: npm run test:e2e --prefix generated-projects/blogforge/frontend

      - name: Verify build (optional)
        # The module lives at ai-agent/agent/quality_gate.py; the previous
        # `ai_agent.agent.quality_gate` import named a package that does not
        # exist, so this step could never have passed.
        env:
          QUALITY_GATE_VERIFY_BUILD: "1"
        run: |
          python - <<PY
          import asyncio, os, sys
          sys.path.insert(0, os.path.abspath('ai-agent'))
          from agent.quality_gate import run_quality_gate
          project_dir = os.path.abspath('generated-projects/blogforge')
          result = asyncio.run(run_quality_gate(project_dir))
          print(result)
          if not result.get('passed'):
              raise SystemExit('Quality gate failed')
          PY

  delivery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify every sell-today product builds
        # delivery/ holds build output only; products/sell-today is the source
        # of truth for the eleven products that ship. The script exits non-zero
        # on any FAIL, so a product that stops building turns CI red.
        run: |
          python scripts/verify_delivery_builds.py \
            --root products/sell-today \
            --layout frontend \
            --json delivery-evidence.json

      - name: Upload delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-evidence
          path: delivery-evidence.json
