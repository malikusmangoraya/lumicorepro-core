name: Database Backup

on:
  schedule:
    # Daily at 03:10 UTC — pg_dump of the live DB
    - cron: '10 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1

      - name: Run backup script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ROOT: ./backups
          ARTIFACTS_DIR: ./uploads
        run: |
          bash scripts/backup-db.sh

      - name: Upload backup artifact (retained 14 days)
        uses: actions/upload-artifact@v4
        with:
          name: lumicorepro-db-${{ github.run_id }}
          path: backups/*.tar.gz
          retention-days: 14

      - name: Prune old artifacts (delete expired actions)
        run: echo "Old artifacts auto-expire per retention-days."

      - name: Report size
        run: |
          ls -lh backups/
          sha256sum backups/*.sha256