name: Deploy Apex to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'products/sell-today/apex/frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: products/sell-today/apex/frontend/package-lock.json

      - name: Install dependencies
        working-directory: products/sell-today/apex/frontend
        run: npm ci

      - name: Build
        working-directory: products/sell-today/apex/frontend
        run: npm run build
        env:
          VITE_BASE_PATH: /lumicorepro-core/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: products/sell-today/apex/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
