# =============================================================================
# LumicorePro — release: build + publish images to GHCR, then (optionally)
# deploy the Compose stack on the VPS over SSH.
# =============================================================================
# Triggered only by a `v*.*.*` tag, i.e. after a green CI run on master and an
# explicit `git tag v1.2.3 && git push --tags`. It never runs on a branch push,
# so a broken branch can never publish an image.
#
# WHAT THIS WORKFLOW ACTUALLY DOES
# --------------------------------
#   verify        Re-runs the merge gate (lint, unit tests, build, bundle
#                 budget). A tag that points at a red commit cannot publish.
#   build-images  Builds both images and PUSHES them to GHCR with the tag
#                 version, `latest`, and the immutable commit SHA. The images
#                 are real and pullable — this is the artefact the VPS runs.
#   deploy        Runs `docker compose pull && docker compose up -d` on the VPS
#                 over SSH. This job is HARD-GATED on the presence of the
#                 deployment secrets: if VPS_HOST / VPS_SSH_KEY / VPS_USER are
#                 not configured the job is SKIPPED with a notice and the
#                 release stops at "images published". It never pretends to
#                 deploy. See docs/DEPLOYMENT.md § "Release" for the manual
#                 equivalent (`docker compose pull && docker compose up -d`).
#
# Required secrets for a hands-off deploy (all optional — see docs/DEPLOYMENT.md):
#   VPS_HOST      Hostname or IP of the production VPS
#   VPS_USER      SSH user that can run docker compose (e.g. deploy)
#   VPS_SSH_KEY   Private key (PEM) for that user
#   VPS_APP_DIR   Directory holding docker-compose.prod.yml (e.g. /srv/lumicorepro)
# GITHUB_TOKEN is provided automatically and is sufficient to push to GHCR.
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v1.2.3'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  IMAGE_BACKEND: ${{ github.repository }}-backend
  IMAGE_FRONTEND: ${{ github.repository }}-frontend

jobs:
  # ── 1. Re-run the gate against the tagged commit ──────────────────────────
  verify:
    name: Verify tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
      - name: Bundle budget
        run: npm run size
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Backend tests
        working-directory: backend
        run: npm run test:ci

  # ── 2. Build and publish images to GHCR ───────────────────────────────────
  build-images:
    name: Build and publish images to GHCR
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: ${{ github.repository }}-backend
          - component: frontend
            context: .
            dockerfile: ./Dockerfile.frontend
            image: ${{ github.repository }}-frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Produces lowercase image references. GHCR requires lowercase repository
      # paths, while github.repository preserves the owner's original casing.
      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          # The VITE_* values are baked into the static bundle at build time.
          # The frontend talks to the API through nginx on the same origin, so
          # the relative default ('/api' via VITE_API_URL='') is correct for the
          # canonical Compose topology. Override the repository variable
          # VITE_API_URL only if the API is served from a separate origin.
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_APP_ENV=production

      - name: Image summary
        run: |
          {
            echo "### Published: ${{ matrix.component }}"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 3. Deploy on the VPS (skipped unless secrets are configured) ──────────
  deploy:
    name: Deploy Compose stack on VPS
    runs-on: ubuntu-latest
    needs: build-images
    if: ${{ github.event_name == 'push' && secrets.VPS_HOST != '' && secrets.VPS_USER != '' && secrets.VPS_SSH_KEY != '' }}
    steps:
      - name: Explain what will happen
        run: |
          {
            echo "### Deploying to ${{ secrets.VPS_HOST }}"
            echo ""
            echo "Running on the host:"
            echo '```'
            echo "docker compose -f docker-compose.prod.yml pull"
            echo "docker compose -f docker-compose.prod.yml up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pull and restart the stack over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR || '/srv/lumicorepro' }}"
            if [ ! -f docker-compose.prod.yml ]; then
              echo "docker-compose.prod.yml not found in $(pwd) — check VPS_APP_DIR" >&2
              exit 1
            fi
            # Deploy the immutable SHA tag, not a floating `latest`, so a
            # rollback is "put the previous SHA back in .env.production".
            export IMAGE_TAG="${{ github.sha }}"
            echo "Deploying IMAGE_TAG=$IMAGE_TAG"
            docker compose -f docker-compose.prod.yml --env-file .env.production pull
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --remove-orphans
            docker compose -f docker-compose.prod.yml --env-file .env.production ps
            # Local health probe; the authoritative checks are in
            # docs/RUNBOOK.md § "Is the deploy healthy?".
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1/api/health > /dev/null; then
                echo "Health check passed after ${i}s"
                exit 0
              fi
              sleep 1
            done
            echo "Health check did not pass within 30s" >&2
            docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail=100
            exit 1

  # ── Manual-deploy notice when secrets are missing ─────────────────────────
  deploy-manual-notice:
    name: Manual deploy required (secrets not configured)
    runs-on: ubuntu-latest
    needs: build-images
    if: ${{ github.event_name == 'push' && (secrets.VPS_HOST == '' || secrets.VPS_USER == '' || secrets.VPS_SSH_KEY == '') }}
    steps:
      - name: Tell the operator exactly what to run
        run: |
          {
            echo "### Images published — manual VPS step required"
            echo ""
            echo "VPS_HOST / VPS_USER / VPS_SSH_KEY are not configured as repository"
            echo "secrets, so no SSH deploy was attempted. The images above are"
            echo "live in GHCR and can be deployed by hand:"
            echo ""
            echo '```bash'
            echo "cd /srv/lumicorepro"
            echo "export IMAGE_TAG=${GITHUB_SHA}"
            echo "docker compose -f docker-compose.prod.yml --env-file .env.production pull"
            echo "docker compose -f docker-compose.prod.yml --env-file .env.production up -d --remove-orphans"
            echo "curl -fsS https://<your-domain>/api/health"
            echo '```'
            echo ""
            echo "See docs/DEPLOYMENT.md § Release for the full procedure."
          } >> "$GITHUB_STEP_SUMMARY"
