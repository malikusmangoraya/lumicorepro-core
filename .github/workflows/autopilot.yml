# =============================================================================
# Autopilot — automated audit, repair and release-readiness sweep
# =============================================================================
# Why this exists: generated projects drift (missing CSP, committed secrets,
# copy PII, lint/build regressions) and dependencies rot. Both used to need a
# manual pass. This workflow runs the autopilot agent over every generated
# project on a schedule and uploads machine-readable reports, and separately
# re-runs the full test matrix weekly so a red suite is caught before it ships.
#
# Contract:
#   - autopilot.yml never pushes, commits or deploys. It reports. Repairs are
#     opt-in per run (`fix: true`) and still only touch generated projects.
#   - The weekly matrix job fails loudly (that is the point of a gate); the
#     autopilot job is informational and stays green so a nightly dip in a
#     generated project's quality score cannot block unrelated work.
# =============================================================================

name: Autopilot

on:
  schedule:
    # 03:17 UTC daily — off the hour so this job does not pile up with every
    # other scheduled workflow on the platform.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      fix:
        description: 'Apply repairs to generated projects'
        type: boolean
        default: false
      limit:
        description: 'Only audit the first N projects (0 = all)'
        type: string
        default: '0'

permissions:
  contents: read

concurrency:
  group: autopilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-projects:
    name: Audit generated projects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Autopilot needs the real generated projects, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-agent/requirements.txt

      - name: Install AI agent dependencies
        working-directory: ai-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Generated projects carry their own node_modules only locally; CI
      # installs the frontend toolchain so the self-heal stage can actually
      # lint/build what it scans.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Run autopilot
        working-directory: ai-agent
        env:
          APPLY_FIXES: ${{ inputs.fix }}
          PROJECT_LIMIT: ${{ inputs.limit }}
        run: |
          ARGS="--threshold ${AUTOPILOT_THRESHOLD:-80}"
          if [ "$APPLY_FIXES" = "true" ]; then ARGS="$ARGS --fix"; fi
          if [ "${PROJECT_LIMIT}" != "0" ] && [ -n "$PROJECT_LIMIT" ]; then ARGS="$ARGS --limit $PROJECT_LIMIT"; fi
          python -m agent.autopilot --root ../generated-projects $ARGS

      - name: Upload autopilot reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autopilot-reports
          path: ai-agent/logs/autopilot/
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### Autopilot"
            echo ""
            echo "Fixes applied: \`${{ inputs.fix }}\`"
            echo ""
            echo "Full reports (JSON + Markdown) are attached as the"
            echo "\`autopilot-reports\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

  weekly-matrix:
    name: Weekly test matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Frontend — install, lint, tests, build
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build
      - name: Backend — install and jest
        working-directory: backend
        run: |
          npm ci
          npm run test:ci

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-agent/requirements.txt
      - name: AI agent — install and pytest
        working-directory: ai-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest tests -q