<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Orders</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 24px; }
  h1 { font-size: 22px; margin-bottom: 16px; }
  input, button { padding: 8px 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; }
  .stats { display: flex; gap: 12px; margin: 12px 0 20px; }
  .stat { background: #1e293b; border-radius: 12px; padding: 12px 18px; }
  .stat b { display: block; font-size: 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #1e293b; vertical-align: top; }
  th { color: #94a3b8; font-size: 11px; text-transform: uppercase; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; background: #334155; }
  .badge.pending { background: #7c2d12; color: #fdba74; }
  .badge.paid { background: #14532d; color: #86efac; }
</style>
</head>
<body>
  <h1>Store Orders — Admin</h1>
  <input id="token" placeholder="ADMIN_TOKEN" type="password" />
  <button onclick="load()">Load</button>
  <div class="stats" id="stats"></div>
  <table>
    <thead><tr><th>Tracking</th><th>When</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <script>
    async function load() {
      const token = document.getElementById('token').value.trim() || 'changeme';
      const [{ orders, count }, stats] = await Promise.all([
        fetch('/api/admin/orders?token=' + encodeURIComponent(token)).then((r) => r.json()),
        fetch('/api/admin/stats?token=' + encodeURIComponent(token)).then((r) => r.json()),
      ]);
      document.getElementById('stats').innerHTML =
        '<div class="stat">Orders<b>' + count + '</b></div>' +
        '<div class="stat">Revenue<b>' + (stats.data || {}).currency + ' ' + ((stats.data || {}).revenue || 0) + '</b></div>' +
        '<div class="stat">Pending<b>' + ((stats.data || {}).pending || 0) + '</b></div>';
      document.getElementById('rows').innerHTML = orders.map((o) => {
        const items = o.items.map((i) => i.qty + 'x ' + i.title).join('<br/>');
        return '<tr><td>' + o.trackingId + '</td><td>' + new Date(o.createdAt).toLocaleString() +
          '</td><td>' + o.customer.name + '<br/>' + o.customer.phone + '<br/>' + (o.customer.address || '') +
          '</td><td>' + items + '</td><td>' + o.currency + ' ' + o.total + '</td>' +
          '<td><span class="badge ' + o.payment.status + '">' + o.payment.method + '</span></td>' +
          '<td><span class="badge ' + o.status + '">' + o.status + '</span></td></tr>';
      }).join('');
    }
    load();
  </script>
</body>
</html>
