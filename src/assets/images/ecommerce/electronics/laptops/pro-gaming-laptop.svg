<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="laptopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="laptopScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#laptopBg)"/>
  <!-- Screen Lid -->
  <rect x="200" y="120" width="400" height="260" rx="16" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  <rect x="216" y="136" width="368" height="228" rx="8" fill="url(#laptopScreen)"/>
  <text x="400" y="240" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">PRO GAMING LAPTOP</text>
  <text x="400" y="270" font-family="system-ui, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">240Hz OLED Display &bull; RTX 4090</text>
  <!-- Base -->
  <path d="M 140 380 L 660 380 L 630 420 L 170 420 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <rect x="340" y="388" width="120" height="12" rx="4" fill="#090d16"/>
</svg>
