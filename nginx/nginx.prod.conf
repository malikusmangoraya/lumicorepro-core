# =============================================================================
# LumicorePro — edge reverse proxy (PRODUCTION, TLS)
# =============================================================================
# Use this file with `docker-compose.prod.yml`. It is mounted at
# /etc/nginx/nginx.conf inside the `nginx` service.
#
# Certificates
#   ./ssl/certs/live/<DOMAIN>/fullchain.pem + privkey.pem
#   (standard certbot layout; the certbot container in the prod Compose file
#   renews into the same directory via the /var/www/certbot webroot)
#
# SERVER_NAME
#   The domain is templated at container start so no host name has to be
#   committed. docker-compose.prod.yml mounts this file into
#   /etc/nginx/templates/nginx.conf.template, and the nginx entrypoint's
#   envsubst step writes /etc/nginx/nginx.conf with ${SERVER_NAME} and
#   ${API_DOMAIN} substituted. Defaults are defined in the Compose file.
#   Before first start, certificates must exist for those names — see
#   docs/DEPLOYMENT.md § TLS. nginx will refuse to start otherwise (that is
#   intentional: a silent HTTP-only fallback would ship a false "TLS enabled").
#
# Routing contract (identical to nginx/nginx.conf):
#   /api/ -> backend:5000 · /uploads/ -> backend:5000 · /socket.io/ -> backend:5000
#   /api-docs -> backend:5000 · /health -> local · everything else -> frontend:8080
# =============================================================================

worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;
  server_tokens   off;

  # Matches express.json({ limit: '10mb' }) and the 10 MB upload cap.
  client_max_body_size 10m;
  client_body_buffer_size 256k;
  client_body_timeout 60s;
  client_header_timeout 60s;
  reset_timedout_connection on;

  # ── TLS ────────────────────────────────────────────────────────────────────
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 127.0.0.11 valid=30s ipv6=off;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json image/svg+xml;

  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_req_status 429;

  upstream backend {
    server backend:5000;
    keepalive 32;
  }

  upstream frontend {
    server frontend:8080;
    keepalive 16;
  }

  # ── :80 — ACME challenge + permanent redirect ──────────────────────────────
  server {
    listen      80;
    listen      [::]:80;
    server_name ${SERVER_NAME};

    # Certbot webroot. Must stay reachable over plain HTTP or renewal breaks.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type text/plain;
      access_log off;
    }

    location /health {
      access_log off;
      default_type text/plain;
      return 200 "OK\n";
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── :443 — application ─────────────────────────────────────────────────────
  server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name ${SERVER_NAME};

    ssl_certificate     /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/${SERVER_NAME}/chain.pem;

    # Security headers are NOT included at server level: every location below
    # includes them itself, because a location with its own add_header discards
    # the inherited set. Adding them here as well would emit duplicates.

    location /api/auth {
      limit_req zone=auth burst=10 nodelay;
      include /etc/nginx/conf.d/security-headers.conf;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header Connection        "";
    }

    location /api/ {
      limit_req zone=api burst=50 nodelay;
      include /etc/nginx/conf.d/security-headers.conf;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header Connection        "";
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    location /api-docs {
      include /etc/nginx/conf.d/security-headers.conf;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
      include /etc/nginx/conf.d/security-headers.conf;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires 7d;
      add_header Cache-Control "public, no-transform" always;
    }

    location /socket.io/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 7d;
      proxy_send_timeout 7d;
    }

    # SPA fallback lives in the frontend container (nginx/frontend.conf).
    location / {
      include /etc/nginx/conf.d/security-headers.conf;
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection        "";
      proxy_read_timeout 60s;
    }

    location = /health {
      include /etc/nginx/conf.d/security-headers.conf;
      access_log off;
      default_type text/plain;
      return 200 "OK\n";
    }
  }
}
