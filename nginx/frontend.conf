# =============================================================================
# LumicorePro — SPA server (frontend image) — internal, plain HTTP, port 8080
# =============================================================================
# Serves the built `dist/` bundle. This server is NOT published to the host and
# is not the TLS terminator: the `nginx` service (nginx/nginx.conf) owns :80/:443,
# adds the security headers and proxies here. That is why this file contains no
# CSP/HSTS — duplicate headers are a common source of "which one won?" bugs.
#
# Security headers for every response live in nginx/security-headers.conf and are
# included by the edge server, which is the only process a client can reach.
# =============================================================================

server {
  listen       8080;
  listen       [::]:8080;
  server_name  _;

  root  /usr/share/nginx/html;
  index index.html;

  # Do not advertise the exact nginx version.
  server_tokens off;

  # ── Compression ────────────────────────────────────────────────────────────
  gzip              on;
  gzip_vary         on;
  gzip_comp_level   6;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    font/woff2;

  # NOTE on brotli: `brotli`/`brotli_static` require the ngx_brotli module, which
  # the stock nginx:alpine / nginx-unprivileged images do NOT include. Enabling it
  # here would make nginx fail to start with "unknown directive". Pre-compressed
  # .br assets are therefore not served unless the image is rebuilt with a
  # brotli-enabled nginx. gzip is the supported path; see docs/DEPLOYMENT.md.

  # ── Hashed assets: immutable ───────────────────────────────────────────────
  # Vite emits assets/[name]-[hash].js|css, so any change produces a new URL.
  # One year + immutable is safe and removes revalidation round-trips.
  location /assets/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # ── Other build output that is safe to cache for a long time ───────────────
  location ~* \.(?:woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico|mp4|webm)$ {
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
  }

  # ── Service worker and PWA manifest must never be cached ──────────────────
  # A cached sw.js pins clients to a stale precache manifest.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location = /manifest.json {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /healthz.txt {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # ── SPA fallback ───────────────────────────────────────────────────────────
  # index.html itself must not be cached, or a client keeps loading the previous
  # release's asset hashes after a deploy.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
