# =============================================================================
# LumicorePro — edge reverse proxy (LOCAL / DEV)
# =============================================================================
# Use this file with `docker-compose.yml` (the local stack). It terminates TLS
# on :443 using a self-signed certificate generated into ./nginx/ssl by
# scripts/dev-certs.sh, so the :443 port mapping in the Compose file is real
# rather than aspirational.
#
# Production uses nginx/nginx.prod.conf (Let's Encrypt certificates under
# ./ssl/certs, ACME webroot challenge). docs/DEPLOYMENT.md explains which file
# belongs to which stack.
#
# Routing contract (identical in both files):
#   /api/            -> backend:5000
#   /api/auth*       -> backend:5000 with a stricter rate limit
#   /api-docs        -> backend:5000
#   /uploads/        -> backend:5000 (user content, no path rewrite)
#   /socket.io/      -> backend:5000 (WebSocket upgrade)
#   /health          -> answered locally
#   everything else  -> frontend:8080, SPA fallback handled there
# =============================================================================

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;
  server_tokens   off;

  # 10 MB matches `express.json({ limit: '10mb' })` in backend/server.js and the
  # 10 MB multer upload cap. Anything above this is rejected at the edge with
  # 413 instead of being buffered and then rejected by Express.
  client_max_body_size 10m;
  client_body_buffer_size 256k;
  client_body_timeout 60s;
  client_header_timeout 60s;
  reset_timedout_connection on;

  # ── TLS ────────────────────────────────────────────────────────────────────
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # ── Compression (brotli is not compiled into stock nginx — see frontend.conf)
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json image/svg+xml;

  # ── Rate limiting ──────────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_req_status 429;

  # Keep the upstream connections alive instead of reconnecting per request.
  upstream backend {
    server backend:5000;
    keepalive 32;
  }

  upstream frontend {
    server frontend:8080;
    keepalive 16;
  }

  # ── HTTP: ACME + redirect to HTTPS ─────────────────────────────────────────
  server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # Local stack: nothing serves ACME here, redirect everything.
    location /health {
      include /etc/nginx/conf.d/security-headers.conf;
      access_log off;
      default_type text/plain;
      return 200 "OK\n";
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS ──────────────────────────────────────────────────────────────────
  server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name _;

    # Created by scripts/dev-certs.sh. Both files are required for nginx to
    # start — run that script before `docker compose up` (the README in
    # nginx/ssl states the same thing).
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Security headers are NOT included at server level: every location below
    # includes them itself, because a location with its own add_header discards
    # the inherited set. Adding them here as well would emit duplicates.

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/auth {
      limit_req zone=auth burst=10 nodelay;
      include /etc/nginx/conf.d/security-headers.conf;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header Connection        "";
    }

    location /api/ {
      limit_req zone=api burst=50 nodelay;
      include /etc/nginx/conf.d/security-headers.conf;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header Connection        "";

      # AI generation streams (SSE) can legitimately run for minutes; buffering
      # would make the progress stream appear to hang.
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # Swagger UI is served by the backend at /api-docs.
    location /api-docs {
      include /etc/nginx/conf.d/security-headers.conf;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded user content. No trailing path on proxy_pass so the backend
    # receives the identical URI it serves from express.static('/uploads').
    # The previous config used `proxy_pass http://backend/uploads/;` inside
    # `location /uploads/`, which appends the request path to the replacement
    # and produces /uploads/uploads/<file>.
    location /uploads/ {
      include /etc/nginx/conf.d/security-headers.conf;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires 7d;
      add_header Cache-Control "public, no-transform" always;
    }

    # Socket.IO real-time notifications.
    location /socket.io/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 7d;
      proxy_send_timeout 7d;
    }

    # ── SPA ──────────────────────────────────────────────────────────────────
    # No `try_files` here: nginx would try to resolve the path against a
    # filesystem it does not have, and combining `proxy_pass` with `try_files`
    # is what made the original file ambiguous. The frontend container owns the
    # SPA fallback (`try_files $uri $uri/ /index.html` in nginx/frontend.conf),
    # which is the documented location for it.
    location / {
      include /etc/nginx/conf.d/security-headers.conf;
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection        "";
      proxy_read_timeout 60s;
    }

    location = /health {
      include /etc/nginx/conf.d/security-headers.conf;
      access_log off;
      default_type text/plain;
      return 200 "OK\n";
    }
  }
}
