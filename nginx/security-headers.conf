# =============================================================================
# LumicorePro — security header block (shared)
# =============================================================================
# Included from EVERY location block that can answer a request for a document,
# asset or API response. It is a snippet rather than a server-level block
# because of two nginx rules that made the original file ineffective:
#
#   1. `add_header` at server level does NOT apply to a 4xx/5xx generated by a
#      location that has its own `add_header` (child blocks discard all parent
#      add_header directives).
#   2. Anything inherited is dropped in any location that adds its own header,
#      which is why /assets/, /uploads/ and /api/ previously shipped responses
#      with no CSP/HSTS at all.
#
# Including this in each location (instead of only at server level) means the
# headers are present on success, redirect and error responses alike.
#
# Content-Security-Policy notes — what this app actually loads:
#   * fonts.googleapis.com stylesheet + fonts.gstatic.com font files
#     (index.html <link rel="preconnect">/<link href=...> for Outfit/Syne/JetBrains Mono).
#   * same-origin /api and /socket.io (WebSocket -> connect-src ws:/wss:).
#   * blob: downloads (AI chat attachment export, CSV export) -> img/media/font blob:.
#   * Stripe is only needed if a Stripe.js checkout is enabled. Listed here
#     because backend/middleware/security.js already whitelists it; it is not
#     loaded by the current src/ bundle.
#   * Analytics: index.html loads no analytics script, and VITE_ENABLE_ANALYTICS
#     defaults to false, so no vendor origin is whitelisted. If you enable
#     VITE_ANALYTICS_PROVIDER=plausible|google you MUST extend script-src (and
#     connect-src for GA4) or the script is blocked. See docs/DEPLOYMENT.md.
#
# `script-src 'self'` deliberately excludes 'unsafe-inline' and 'unsafe-eval'.
# The production bundle has no inline <script> (Vite emits an external module
# entry) and no eval. Adding either back would negate most of the CSP's value.

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self' ws: wss: https://api.lumicorepro.com https://api.stripe.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com; upgrade-insecure-requests" always;

# HSTS: only sent over HTTPS. Browsers ignore it on plain HTTP, and preload +
# includeSubDomains commits every current and future subdomain to HTTPS for two
# years — remove `preload` before submitting to the preload list if any
# subdomain is not HTTPS-ready.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
# Deliberately avoids a quoted origin list inside the value: nested quotes in an
# nginx add_header value must be backslash-escaped, which is easy to get wrong
# and fails at config-parse time. `payment=(self)` is sufficient because
# Stripe.js is same-page and the Payment Request API is not used.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(self)" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
