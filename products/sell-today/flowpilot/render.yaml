# Render Blueprint
services:
  - type: web
    name: flowpilot-frontend
    env: static
    buildCommand: npm ci && npm run build
  - type: web
    name: flowpilot-backend
    env: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health

databases:
  - name: flowpilot-db
    databaseName: flowpilot
