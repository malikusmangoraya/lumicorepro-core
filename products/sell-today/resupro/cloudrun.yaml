# GCP Cloud Run
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: resupro-backend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '1'
        autoscaling.knative.dev/maxScale: '10'
        run.googleapis.com/cpu-throttling: 'false'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/resupro-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '5000'
          envFrom:
            - secretRef:
                name: resupro-secrets
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
  traffic:
    - percent: 100
      latestRevision: true

# Deploy command:
# gcloud run deploy resupro-backend \
#   --image gcr.io/PROJECT_ID/resupro-backend:latest \
#   --region asia-south1 \
#   --platform managed \
#   --allow-unauthenticated
