# DigitalOcean App Platform
name: resupro

services:
  - name: backend
    dockerfile_path: backend/Dockerfile
    source_dir: /
    http_port: 5000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '5000'
      - key: MONGODB_URI
        type: SECRET
      - key: JWT_SECRET
        type: SECRET
      - key: STRIPE_SECRET_KEY
        type: SECRET

static_sites:
  - name: frontend
    build_command: npm ci && npm run build
    output_dir: dist
    catch_all_document: index.html
    cors:
      allow_origins:
        - prefix: https://
    envs:
      - key: NODE_ENV
        value: production

databases:
  - name: resupro-db
    engine: PG
    version: '15'
    size: db-s-dev-database
    num_nodes: 1
