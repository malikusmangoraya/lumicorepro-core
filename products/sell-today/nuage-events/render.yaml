# Render Blueprint
services:
  - type: web
    name: nuage-events-frontend
    env: static
    buildCommand: npm ci && npm run build
  - type: web
    name: nuage-events-backend
    env: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health

databases:
  - name: nuage-events-db
    databaseName: nuage_events
