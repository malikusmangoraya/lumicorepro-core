# Render Blueprint
services:
  - type: web
    name: aurelia-estates-frontend
    env: static
    buildCommand: npm ci && npm run build
  - type: web
    name: aurelia-estates-backend
    env: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health

databases:
  - name: aurelia-estates-db
    databaseName: aurelia_estates
