# docker-compose-template.yml
# Reused by every product backend's docker-compose.yml.
# Products import this via extension fields or copy the same shape locally.

version: "3.9"

x-defaults: &defaults
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - .env
  environment:
    NODE_ENV: production

x-services: &services
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-lumicore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-lumicore}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lumicore} -d ${DB_NAME:-lumicore}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  backend:
    <<: *defaults
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads

  frontend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: node server.js
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    depends_on:
      - backend
    ports:
      - "127.0.0.1:80:3000"
    volumes:
      - frontend-dist:/app/dist:ro

volumes:
  db-data:
  redis-data:
  uploads:
  frontend-dist:
