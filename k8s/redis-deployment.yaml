apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumicorepro-redis
  namespace: lumicorepro
  labels:
    app: lumicorepro-redis
    tier: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lumicorepro-redis
  template:
    metadata:
      labels:
        app: lumicorepro-redis
        tier: cache
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999  # redis user

      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - ""        # Disable RDB snapshots in k8s (use PVC for persistence)
          ports:
            - containerPort: 6379
              name: redis

          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumicorepro-secrets
                  key: REDIS_PASSWORD

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a $REDIS_PASSWORD ping | grep PONG
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a $REDIS_PASSWORD ping | grep PONG
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "320Mi"

          volumeMounts:
            - name: redis-data
              mountPath: /data

      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: lumicorepro
  labels:
    app: lumicorepro-redis
spec:
  selector:
    app: lumicorepro-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP          # Internal only — never expose Redis publicly

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: lumicorepro
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard
