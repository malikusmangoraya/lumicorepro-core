# =============================================================================
# LumicorePro — Redis Deployment + Service + PVC
# =============================================================================
# SECONDARY TARGET. Canonical production is Docker Compose on one VPS; see
# docs/DEPLOYMENT.md. Not applied by CI and not verified on a live cluster.
#
# This is now the ONLY definition of Redis in k8s/. A duplicate StatefulSet +
# `redis-service` used to live in k8s/postgres-deployment.yaml with a different
# label set (`app: redis`) and a different Service type (headless). Because
# `kubectl apply -f k8s/` applies files in lexical order, the duplicate was
# resolved by filename rather than by intent, and whichever Service lost left a
# selector that matched no pods. See the note at the end of postgres-deployment.yaml.
#
# The Service name `redis-service` is what k8s/configmap.yaml's REDIS_URL targets.
# Renaming it requires updating that ConfigMap in the same change.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumicorepro-redis
  namespace: lumicorepro
  labels:
    app: lumicorepro-redis
    tier: cache
    app.kubernetes.io/part-of: lumicorepro
spec:
  replicas: 1
  strategy:
    # Redis keeps state on a PVC that only one pod can mount, so a surge pod
    # would block on the volume. Recreate is the correct strategy here.
    type: Recreate
  selector:
    matchLabels:
      app: lumicorepro-redis
  template:
    metadata:
      labels:
        app: lumicorepro-redis
        tier: cache
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999        # `redis` user in the official image
        fsGroup: 999

      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
            - --appendonly
            - "no"            # a cache, not a system of record
          ports:
            - containerPort: 6379
              name: redis

          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumicorepro-secrets
                  key: REDIS_PASSWORD

          # Probes authenticate. The previous probe ran bare `redis-cli ping`,
          # which returns NOAUTH once --requirepass is set, so the container would
          # have been marked unhealthy and restart-looped forever.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "320Mi"

          volumeMounts:
            - name: redis-data
              mountPath: /data

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: lumicorepro
  labels:
    app: lumicorepro-redis
    app.kubernetes.io/part-of: lumicorepro
spec:
  selector:
    app: lumicorepro-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP          # Internal only — never expose Redis publicly

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: lumicorepro
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard
