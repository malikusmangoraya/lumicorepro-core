apiVersion: v1
kind: ConfigMap
metadata:
  name: lumicorepro-config
  namespace: lumicorepro
data:
  NODE_ENV: "production"
  PORT: "5000"
  FRONTEND_URL: "https://lumicorepro.com"
  CORS_ORIGIN: "https://lumicorepro.com"
  JWT_EXPIRES_IN: "7d"
  SMTP_PORT: "587"
  FROM_EMAIL: "noreply@lumicorepro.com"
  REDIS_URL: "redis://redis-service:6379"
