apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumicorepro-frontend
  namespace: lumicorepro
  labels:
    app: lumicorepro-frontend
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lumicorepro-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: lumicorepro-frontend
        tier: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101       # nginx user

      containers:
        - name: frontend
          image: ghcr.io/lumicorepro/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: lumicorepro
  labels:
    app: lumicorepro-frontend
spec:
  selector:
    app: lumicorepro-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
