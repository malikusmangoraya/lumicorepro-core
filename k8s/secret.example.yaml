# =============================================================================
# LumicorePro — Secret TEMPLATE (do NOT apply this file as-is)
# =============================================================================
# This file is a DOCUMENTED TEMPLATE. It is committed on purpose and contains no
# real credential. The previous k8s/secret.yaml committed base64 "values" that
# decoded to strings like `change_me`, and it was applied by anything that ran
# `kubectl apply -f k8s/` — i.e. a cluster could come up with a known JWT secret.
#
# Create the real Secret imperatively instead (values never touch git):
#
#   kubectl create namespace lumicorepro --dry-run=client -o yaml | kubectl apply -f -
#
#   kubectl -n lumicorepro create secret generic lumicorepro-secrets \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 32)" \
#     --from-literal=REDIS_PASSWORD="$(openssl rand -base64 32)" \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 48)" \
#     --from-literal=JWT_REFRESH_SECRET="$(openssl rand -hex 48)" \
#     --from-literal=STRIPE_SECRET_KEY="" \
#     --from-literal=STRIPE_WEBHOOK_SECRET="" \
#     --from-literal=STRIPE_PUBLISHABLE_KEY="" \
#     --from-literal=SENTRY_DSN="" \
#     --from-literal=SMTP_USER="" \
#     --from-literal=SMTP_PASS=""
#
# Verify the keys the Deployments expect:
#   kubectl -n lumicorepro get secret lumicorepro-secrets -o jsonpath='{.data}' | tr ',' '\n'
#
# Rotate without editing git:
#   kubectl -n lumicorepro create secret generic lumicorepro-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 48)" ... \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n lumicorepro rollout restart deploy/lumicorepro-backend
#
# Required keys (a missing key makes the pod fail with CreateContainerConfigError,
# which is the intended failure mode — better than booting with an empty secret):
#   POSTGRES_PASSWORD  used by the postgres StatefulSet
#   REDIS_PASSWORD     used by the redis Deployment and by REDIS_URL
#   JWT_SECRET         >= 32 chars, validated at boot by the backend
#   JWT_REFRESH_SECRET >= 32 chars, must differ from JWT_SECRET
# Optional keys (empty string when unused):
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PUBLISHABLE_KEY,
#   SENTRY_DSN, SMTP_USER, SMTP_PASS
#
# NOTE: MONGODB_URI was in the old template. This application does not use
# MongoDB (PostgreSQL + Sequelize only), so it has been removed rather than left
# as a decoy.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: lumicorepro-secrets
  namespace: lumicorepro
  labels:
    app.kubernetes.io/part-of: lumicorepro
  annotations:
    lumicorepro.io/note: "TEMPLATE — see the header of this file. Do not apply."
type: Opaque
stringData:
  # Obvious non-values, so an accidental apply fails loudly at boot (the backend
  # rejects a JWT secret shorter than 32 chars) instead of silently using a
  # credential that is published in this repository.
  POSTGRES_PASSWORD: "REPLACE_ME"
  REDIS_PASSWORD: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"
  JWT_REFRESH_SECRET: "REPLACE_ME"
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  STRIPE_PUBLISHABLE_KEY: ""
  SENTRY_DSN: ""
  SMTP_USER: ""
  SMTP_PASS: ""
