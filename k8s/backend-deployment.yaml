apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumicorepro-backend
  namespace: lumicorepro
  labels:
    app: lumicorepro-backend
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lumicorepro-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: lumicorepro-backend
        tier: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/api/health/metrics"
    spec:
      # Graceful shutdown
      terminationGracePeriodSeconds: 30

      # Security context — run as non-root
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      containers:
        - name: backend
          image: ghcr.io/lumicorepro/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
              protocol: TCP

          # Environment from ConfigMap
          envFrom:
            - configMapRef:
                name: lumicorepro-config

          # Sensitive vars from Secret
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lumicorepro-secrets
                  key: JWT_SECRET
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lumicorepro-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: lumicorepro-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: lumicorepro-secrets
                  key: MONGODB_URI
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: lumicorepro-secrets
                  key: SENTRY_DSN
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: lumicorepro-secrets
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: lumicorepro-secrets
                  key: SMTP_PASS

          # Liveness — container restart if unhealthy
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness — traffic only when ready
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Resource limits
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # Mounted volumes
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads

      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: backend-uploads-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: lumicorepro
  labels:
    app: lumicorepro-backend
spec:
  selector:
    app: lumicorepro-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-uploads-pvc
  namespace: lumicorepro
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
