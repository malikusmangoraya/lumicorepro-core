apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: lumicorepro
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 999
        fsGroup: 999

      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres

          env:
            - name: POSTGRES_DB
              value: lumicorepro_db
            - name: POSTGRES_USER
              value: lumicore
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumicorepro-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "lumicore", "-d", "lumicorepro_db"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "lumicore", "-d", "lumicorepro_db"]
            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
        storageClassName: standard

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lumicorepro
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None    # Headless service for StatefulSet

# =============================================================================
# REMOVED FROM THIS FILE: the Redis StatefulSet and the `redis-service` Service.
#
# Both Redis objects were defined twice — here and in k8s/redis-deployment.yaml —
# with different resource names, labels and storage. `kubectl apply -f k8s/`
# would apply whichever file was read last, so the resulting cluster depended on
# lexical file order: this file ("postgres-…") sorts before "redis-…", meaning
# redis-deployment.yaml won, but nothing documented that and the two definitions
# disagreed on the Service selector (`app: redis` vs `app: lumicorepro-redis`).
# A Service whose selector matches no pod endpoints silently blackholes traffic.
#
# Redis is now defined exactly once, in k8s/redis-deployment.yaml.
# =============================================================================
