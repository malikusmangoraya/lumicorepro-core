# =============================================================================
# LumicorePro — Ingress + HorizontalPodAutoscalers
# =============================================================================
# SECONDARY TARGET. Canonical production is Docker Compose on one VPS; see
# docs/DEPLOYMENT.md. Not applied by CI and not verified on a live cluster.
#
# Requires in the cluster (not provided here):
#   * an Ingress controller (annotations below assume ingress-nginx)
#   * cert-manager with a ClusterIssuer named `letsencrypt-prod`
#
# Host layout
#   lumicorepro.com       /      -> frontend-service:80
#                         /api   -> backend-service:5000
#   www.lumicorepro.com          -> frontend-service:80
#   api.lumicorepro.com   /      -> backend-service:5000
#
# The same-origin `/api` route is the one the shipped frontend uses: the bundle
# defaults to calling `<origin>/api`, which is exactly this path. The api.* host
# exists for direct API clients and makes FRONTEND_URL/CORS_ORIGIN unnecessary for
# the SPA — but CORS_ORIGIN in k8s/configmap.yaml still lists both origins, so
# either layout works without a change here.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lumicorepro-ingress
  namespace: lumicorepro
  labels:
    app.kubernetes.io/part-of: lumicorepro
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Matches express.json({ limit: '10mb' }) and the 10 MB upload cap.
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

    # AI generation streams (SSE) can run for minutes.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"

    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://lumicorepro.com"

    # Socket.IO needs affinity: with 2+ backend replicas a client must keep
    # hitting the same pod for the lifetime of the WebSocket. Without this,
    # handshakes succeed and then silently upgrade to a pod that does not know
    # the session. VERIFY after deploy (docs/RUNBOOK.md § "Verify the WebSocket").
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "lumicorepro-affinity"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
    nginx.ingress.kubernetes.io/session-cookie-samesite: "Lax"
    nginx.ingress.kubernetes.io/session-cookie-secure: "true"

    cert-manager.io/cluster-issuer: letsencrypt-prod

    # edge-level rate limit; the application has its own per-route limiter too
    nginx.ingress.kubernetes.io/limit-rps: "100"

spec:
  tls:
    - hosts:
        - lumicorepro.com
        - www.lumicorepro.com
        - api.lumicorepro.com
      secretName: lumicorepro-tls

  rules:
    # ── Main site ─────────────────────────────────────────────────────────────
    - host: lumicorepro.com
      http:
        paths:
          # API first: the longest matching prefix wins, but keeping this entry
          # explicit is what makes the SPA's `/api` calls reach the backend
          # instead of being answered by the frontend's index.html fallback.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
          - path: /api-docs
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

    # ── www ───────────────────────────────────────────────────────────────────
    # Serves the same app. A host-level redirect to the apex would need an
    # additional annotation/ConfigMap in ingress-nginx; not added here because it
    # is controller-specific and unverified.
    - host: www.lumicorepro.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

    # ── Direct API host (API clients, webhooks) ───────────────────────────────
    - host: api.lumicorepro.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000

---
# Horizontal Pod Autoscaler — Backend
# 2..10 replicas on CPU 70% / memory 80%. The HPA needs resource REQUESTS on the
# target Deployment to compute utilisation; backend-deployment.yaml sets them.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: lumicorepro
  labels:
    app.kubernetes.io/part-of: lumicorepro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lumicorepro-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      # Avoid flapping when a burst of AI generation requests subsides.
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30

---
# Horizontal Pod Autoscaler — Frontend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: lumicorepro
  labels:
    app.kubernetes.io/part-of: lumicorepro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lumicorepro-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
