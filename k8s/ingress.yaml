apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lumicorepro-ingress
  namespace: lumicorepro
  annotations:
    # Nginx Ingress Controller
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"

    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://lumicorepro.com"

    # Let's Encrypt TLS via cert-manager
    cert-manager.io/cluster-issuer: letsencrypt-prod

    # Rate limiting (100 req/min per IP)
    nginx.ingress.kubernetes.io/limit-rps: "100"

    # Gzip
    nginx.ingress.kubernetes.io/configuration-snippet: |
      gzip on;
      gzip_types text/plain application/json application/javascript text/css;

spec:
  tls:
    - hosts:
        - lumicorepro.com
        - www.lumicorepro.com
        - api.lumicorepro.com
      secretName: lumicorepro-tls

  rules:
    # Main website
    - host: lumicorepro.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

    # WWW redirect (handled by nginx ingress annotations)
    - host: www.lumicorepro.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

    # API subdomain
    - host: api.lumicorepro.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000

---
# Horizontal Pod Autoscaler — Backend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: lumicorepro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lumicorepro-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# Horizontal Pod Autoscaler — Frontend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: lumicorepro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lumicorepro-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
