# =============================================================================
# MOVED — this file intentionally no longer defines a Secret.
# =============================================================================
# It used to contain a committed `kind: Secret` with base64 values that decoded
# to `change_me` / placeholder strings. Because `kubectl apply -f k8s/` picks up
# every YAML in the directory, a cluster could be created with a JWT secret that
# is published in this repository. That is a credential in git, so the manifest
# is gone.
#
# Create the real Secret imperatively — values never touch the repository:
#
#   kubectl -n lumicorepro create secret generic lumicorepro-secrets \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 32)" \
#     --from-literal=REDIS_PASSWORD="$(openssl rand -base64 32)" \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 48)" \
#     --from-literal=JWT_REFRESH_SECRET="$(openssl rand -hex 48)"
#
# The full key list, rotation procedure and failure modes are documented in
# k8s/secret.example.yaml — read that file before deploying.
#
# This file is kept (containing no Kubernetes object) so that a stale copy in a
# developer's checkout or CI cache cannot silently re-introduce the placeholder
# Secret; the only object definitions in k8s/ are now the ones that are meant to
# be applied.
# =============================================================================
