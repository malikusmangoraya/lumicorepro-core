# Render Blueprint
services:
  - type: web
    name: saffron-voyage-frontend
    env: static
    buildCommand: npm ci && npm run build
  - type: web
    name: saffron-voyage-backend
    env: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health

databases:
  - name: saffron-voyage-db
    databaseName: saffron_voyage
