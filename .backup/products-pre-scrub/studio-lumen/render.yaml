# Render Blueprint
services:
  - type: web
    name: studio-lumen-frontend
    env: static
    buildCommand: npm ci && npm run build
  - type: web
    name: studio-lumen-backend
    env: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health

databases:
  - name: studio-lumen-db
    databaseName: studio_lumen
