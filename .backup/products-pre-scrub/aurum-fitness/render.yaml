# Render Blueprint
services:
  - type: web
    name: aurum-fitness-frontend
    env: static
    buildCommand: npm ci && npm run build
  - type: web
    name: aurum-fitness-backend
    env: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health

databases:
  - name: aurum-fitness-db
    databaseName: aurum_fitness
