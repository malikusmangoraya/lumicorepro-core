[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E9 = syntax/IO errors, F = pyflakes. Both are correctness rules: a file that
# trips them is broken, not merely styled differently. Stylistic families are
# deliberately excluded so the ratchet measures defects, and so the baseline
# does not move every time a formatter preference changes.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Test modules legitimately import fixtures and re-define names across cases.
"tests/*" = ["F401", "F811"]

[tool.bandit]
exclude_dirs = ["tests", "node_modules", ".venv", "venv"]
skips = ["B101"]
