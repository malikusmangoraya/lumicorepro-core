version: '3.8'

services:
  # PostgreSQL Database (Sequelize)
  postgres:
    image: postgres:16-alpine
    container_name: lumicorepro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lumicorepro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lumicorepro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis Cache (system config, sessions, BullMQ queues)
  redis:
    image: redis:7-alpine
    container_name: lumicorepro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lumicorepro-network

  # Backend API Server (Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lumicorepro-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/lumicorepro
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-secure-random-string}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change-this-refresh-secret-too}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - DEMO_MODE=true
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - lumicorepro-network

  # Frontend (Vite build served for production preview)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: lumicorepro-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - lumicorepro-network

  # Nginx Reverse Proxy (single entry point on :80)
  nginx:
    image: nginx:alpine
    container_name: lumicorepro-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - lumicorepro-network

networks:
  lumicorepro-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: